name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check model package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        # The model layer has no UI dependency, so the runtime requirements
        # (Pillow, for the Tkinter views) are deliberately not installed here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the model package imports cleanly
        # No test suite in the repository yet; that arrives in a later branch.
        # Until then CI verifies the package is importable without a display.
        run: |
          python -c "import model.card, model.card_library, model.deck, model.dealer, model.player, model.login_model, model.weapon_style; print('model package imports OK')"
